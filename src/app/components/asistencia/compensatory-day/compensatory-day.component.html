<div class="w-full mx-auto p-6 bg-fiori-background min-h-screen">
  <!-- Header compacto -->
  <div class="bg-fiori-surface rounded-lg shadow-fioriSm border border-fiori-border p-3 mb-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-fiori-primary/10 rounded-lg flex items-center justify-center">
          <lucide-icon name="calendar-days" class="w-4 h-4 text-fiori-primary"></lucide-icon>
        </div>
        <div>
          <div class="text-lg font-semibold text-fiori-text">
            Días Compensatorios
          </div>
          <div class="text-xs text-fiori-subtext">
            {{ totalCount }} registros encontrados
          </div>
        </div>
      </div>
    </div>
    
    <!-- Botón de acción compacto -->
    <div class="mt-3 pt-3 border-t border-fiori-border">
      <button
        (click)="createNew()"
        class="inline-flex items-center px-3 py-1.5 bg-fiori-primary text-white text-sm font-medium rounded-lg hover:bg-fiori-secondary transition-colors"
      >
        <lucide-icon name="plus" class="w-4 h-4 mr-1"></lucide-icon>
        Nuevo Día Compensatorio
      </button>
    </div>
  </div>


  <!-- Tabla de días compensatorios -->
  <div class="bg-fiori-surface rounded-lg shadow-fioriSm border border-fiori-border overflow-hidden">
    <div class="px-4 py-3 border-b border-fiori-border bg-fiori-muted">
      <div class="flex items-center justify-between mb-3">
        <div class="text-lg font-semibold text-fiori-text">
          Lista de Días Compensatorios
        </div>
        <div class="flex items-center space-x-3">
          <div class="text-sm text-fiori-subtext">
            <span>Mostrando {{ compensatoryDays.length }} de {{ totalCount }} registros</span>
          </div>
        </div>
      </div>
      
      <!-- Filtros compactos -->
      <form [formGroup]="filterForm" (ngSubmit)="applyFilters()">
        <div class="flex items-center space-x-3 flex-wrap gap-y-2">
          <!-- Búsqueda general -->
          <div class="relative min-w-[200px]">
            <lucide-icon name="search" class="absolute left-2 top-1/2 transform -translate-y-1/2 w-3 h-3 text-fiori-subtext"></lucide-icon>
            <input
              type="text"
              formControlName="searchTerm"
              placeholder="Buscar empleado..."
              class="w-full pl-7 pr-2 py-1.5 text-xs border border-gray-300 rounded-md bg-white focus:ring-1 focus:ring-fiori-primary focus:border-fiori-primary"
            />
          </div>

          <!-- Estado -->
          <select
            formControlName="status"
            class="px-2 py-1.5 text-xs border border-gray-300 rounded-md bg-white focus:ring-1 focus:ring-fiori-primary focus:border-fiori-primary min-w-[120px]"
          >
            <option value="">Todos</option>
            <option value="P">Pendiente</option>
            <option value="A">Aprobado</option>
            <option value="R">Rechazado</option>
          </select>

          <!-- Fecha desde -->
          <input
            type="date"
            formControlName="startDate"
            class="px-2 py-1.5 text-xs border border-gray-300 rounded-md bg-white focus:ring-1 focus:ring-fiori-primary focus:border-fiori-primary"
          />

          <!-- Fecha hasta -->
          <input
            type="date"
            formControlName="endDate"
            class="px-2 py-1.5 text-xs border border-gray-300 rounded-md bg-white focus:ring-1 focus:ring-fiori-primary focus:border-fiori-primary"
          />

          <!-- Botones de acción -->
          <div class="flex items-center space-x-2 ml-auto">
            <button
              type="button"
              (click)="clearFilters()"
              class="px-2 py-1.5 text-xs font-medium text-fiori-subtext border border-gray-300 rounded-md hover:bg-fiori-hover transition-colors"
              title="Limpiar filtros"
            >
              <lucide-icon name="x" class="w-3 h-3"></lucide-icon>
            </button>
            <button
              type="submit"
              class="px-8 py-2  flex text-xs font-medium text-white bg-fiori-primary border border-fiori-primary rounded-md hover:bg-fiori-secondary transition-colorsf"
              title="Aplicar filtros"
            >
              <lucide-icon name="search" class="w-3 h-3 mr-1"></lucide-icon>
              Buscar
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Overlay de loading -->
    <div
      *ngIf="loading"
      class="absolute inset-0 z-10 flex items-center justify-center bg-white/70"
    >
      <div class="text-center p-4">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-fiori-primary mb-2"></div>
        <p class="text-sm text-fiori-subtext">Cargando días compensatorios...</p>
      </div>
    </div>

    <!-- ag-Grid Container -->
    <div class="relative h-[70vh]">
      <!-- ag-Grid -->
      <div class="ag-theme-quartz w-full h-full">
        <ag-grid-angular
          #agGrid
          [columnDefs]="columnDefs"
          [rowData]="compensatoryDays"
          class="w-full h-full"
          [gridOptions]="gridOptions"
          (gridReady)="onGridReady($event)"
        ></ag-grid-angular>
      </div>

      <!-- Estado vacío -->
      <div
        *ngIf="!loading && (!compensatoryDays || compensatoryDays.length === 0)"
        class="absolute inset-0 flex items-center justify-center bg-fiori-surface"
      >
        <div class="text-center p-8">
          <div class="w-16 h-16 bg-fiori-background rounded-xl flex items-center justify-center mx-auto mb-4">
            <lucide-icon name="calendar-days" class="w-8 h-8 text-fiori-subtext"></lucide-icon>
          </div>
          <div class="text-lg font-semibold text-fiori-text mb-2">
            No hay días compensatorios
          </div>
          <p class="text-fiori-subtext mb-4 max-w-sm">
            No se encontraron días compensatorios con los filtros aplicados
          </p>
          <button
            (click)="createNew()"
            class="inline-flex items-center px-4 py-2 bg-fiori-primary text-white text-sm font-medium rounded-lg hover:bg-fiori-secondary transition-colors"
          >
            <lucide-icon name="plus" class="w-4 h-4 mr-2"></lucide-icon>
            Crear Primer Registro
          </button>
        </div>
      </div>
    </div>

    <!-- Paginador -->
    <app-fiori-paginator
      [totalRecords]="totalCount"
      [pageSize]="pageSize"
      [pageNumber]="page"
      [pageSizeOptions]="[10, 25, 50, 100]"
      [showAllOption]="false"
      [loading]="loading"
      (pageChange)="onPageChange($event)">
    </app-fiori-paginator>
  </div>
</div>
