<div class="p-4 max-w-full h-full flex flex-col">

  <!-- Wrapper con estilos Fiori -->
  <div class="bg-fiori-surface rounded-lg shadow-fioriSm border border-fiori-border mb-4">
    <!-- Formulario de filtros -->
    <form [formGroup]="filterForm" (ngSubmit)="onFilter()" class="p-4 bg-fiori-surface">
      <!-- Filtros principales -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
        
        <!-- Rango de Fechas -->
        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-fiori-text mb-1">
            <lucide-icon name="calendar-range" class="w-3 h-3 inline mr-1"></lucide-icon>
            Rango de Fechas <span class="text-fiori-error">*</span>
          </label>
          <app-date-range-picker
            formControlName="dateRange"
            placeholder="Seleccionar rango de fechas"
            size="md"
            theme="fiori"
            [compact]="true"
            [disableHolidays]="true">
          </app-date-range-picker>
          <p *ngIf="filterForm.get('dateRange')?.hasError('required') && filterForm.get('dateRange')?.touched" 
             class="text-xs text-fiori-error mt-1">
            <lucide-icon name="alert-circle" class="w-2 h-2 inline mr-1"></lucide-icon>
            Requerido
          </p>
        </div>

        <!-- Sede -->
        <div>
          <label class="block text-xs font-medium text-fiori-text mb-1">
            <lucide-icon name="map-pin" class="w-3 h-3 inline mr-1"></lucide-icon>
            Sede
          </label>
          <div class="relative">
            <input 
              type="text" 
              formControlName="sedeFilter"
              (input)="onSedeFilterChange($event)"
              (focus)="showSedeDropdown = true"
              (blur)="onSedeBlur()"
              placeholder="Buscar sede..."
              class="w-full pl-8 pr-3 py-2 text-sm border border-gray-300 rounded-md bg-white text-gray-900 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all">
            <div class="absolute left-2 top-1/2 transform -translate-y-1/2">
                <lucide-icon name="map-pin" class="w-3 h-3 text-gray-500"></lucide-icon>
            </div>
            
            <!-- Dropdown -->
            <div *ngIf="showSedeDropdown" 
                 class="absolute z-[9999] w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto">
              <div 
                (mousedown)="onSedeSelected(null)"
                class="px-3 py-2 text-sm cursor-pointer hover:bg-blue-50 transition-colors flex items-center gap-2 border-b border-gray-200 sticky top-0 bg-white">
                <lucide-icon name="globe" class="w-4 h-4 text-blue-600"></lucide-icon>
                <span class="text-gray-900 font-medium">Todas las sedes</span>
              </div>
              <div *ngFor="let sede of filteredSedes" 
                   (mousedown)="onSedeSelected(sede)"
                   class="px-3 py-2 text-sm cursor-pointer hover:bg-blue-50 transition-colors flex items-center gap-2">
                <lucide-icon name="map-pin" class="w-4 h-4 text-gray-600"></lucide-icon>
                <span class="text-gray-900">{{ sede.descripcion }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Área -->
        <div>
          <label class="block text-xs font-medium text-fiori-text mb-1">
            <lucide-icon name="building-2" class="w-3 h-3 inline mr-1"></lucide-icon>
            Área
          </label>
          <div class="relative">
            <input 
              type="text" 
              formControlName="areaFilter"
              (input)="onAreaFilterChange($event)"
              (focus)="showAreaDropdown = true"
              (blur)="onAreaBlur()"
              placeholder="Buscar área..."
              class="w-full pl-8 pr-3 py-2 text-sm border border-gray-300 rounded-md bg-white text-gray-900 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 transition-all">
            <div class="absolute left-2 top-1/2 transform -translate-y-1/2">
                <lucide-icon name="building-2" class="w-3 h-3 text-gray-500"></lucide-icon>
            </div>
            
            <!-- Dropdown -->
            <div *ngIf="showAreaDropdown" 
                 class="absolute z-[9999] w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto">
              <div 
                (mousedown)="onAreaSelected(null)"
                class="px-3 py-2 text-sm cursor-pointer hover:bg-blue-50 transition-colors flex items-center gap-2 border-b border-gray-200 sticky top-0 bg-white">
                <lucide-icon name="globe" class="w-4 h-4 text-blue-600"></lucide-icon>
                <span class="text-gray-900 font-medium">Todas las áreas</span>
              </div>
              <div *ngFor="let area of filteredAreas" 
                   (mousedown)="onAreaSelected(area)"
                   class="px-3 py-2 text-sm cursor-pointer hover:bg-blue-50 transition-colors flex items-center gap-2">
                <lucide-icon name="building" class="w-4 h-4 text-gray-600"></lucide-icon>
                <span class="text-gray-900">{{ area.descripcion }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones de acción -->
      <div class="flex items-center gap-3 mt-4 pt-4 border-t border-fiori-border">
        <button 
          type="submit"
          [disabled]="loading || filterForm.invalid"
          class="inline-flex items-center gap-2 px-4 py-2 bg-fiori-primary text-white text-sm font-medium rounded-md hover:bg-fiori-secondary focus:ring-1 focus:ring-fiori-primary transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <lucide-icon [name]="loading ? 'refresh-cw' : 'search'" 
                       [class]="loading ? 'w-4 h-4 animate-spin' : 'w-4 h-4'"></lucide-icon>
          <span>{{ loading ? 'Buscando...' : 'Buscar' }}</span>
        </button>

        <button 
          type="button"
          (click)="onClearFilters()"
          class="inline-flex items-center gap-2 px-3 py-2 bg-fiori-muted text-fiori-subtext text-sm font-medium rounded-md hover:bg-fiori-hover transition-colors">
          <lucide-icon name="x-circle" class="w-4 h-4"></lucide-icon>
          <span>Limpiar</span>
        </button>
      </div>
    </form>
  </div>

  <!-- Contenedor de la tabla AG-Grid -->
  <div class="flex-1 bg-fiori-surface rounded-lg shadow-fioriSm border border-fiori-border overflow-hidden">
    
    <!-- Loading -->
    <div *ngIf="loading" class="flex items-center justify-center h-full">
      <div class="flex items-center gap-2">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-fiori-primary"></div>
        <span class="text-fiori-subtext text-sm">Cargando datos...</span>
      </div>
    </div>

    <!-- AG-Grid -->
    <div *ngIf="!loading" class="ag-theme-quartz" style="height: 100%; width: 100%;">
      <ag-grid-angular
        #agGrid
        [columnDefs]="columnDefs"
        [rowData]="rowData"
        [gridOptions]="gridOptions"
        style="height: 100%; width: 100%;">
      </ag-grid-angular>
    </div>

    <!-- Empty state (manejado por AG-Grid con overlay) -->
  </div>

  <!-- Estado vacío -->
  <div *ngIf="!loading && rowData.length === 0" 
       class="bg-fiori-surface rounded-lg shadow-fioriSm border border-fiori-border p-12 text-center">
    <div class="flex flex-col items-center">
      <div class="w-20 h-20 bg-fiori-muted rounded-full flex items-center justify-center mb-4">
        <lucide-icon name="calendar-x" class="w-10 h-10 text-fiori-subtext"></lucide-icon>
      </div>
      <h3 class="text-lg font-medium text-fiori-text mb-2">No hay datos para mostrar</h3>
      <p class="text-sm text-fiori-subtext mb-6">
        Ajusta los filtros y busca nuevamente para ver los resultados
      </p>
      <button 
        type="button"
        (click)="onFilter()"
        [disabled]="filterForm.invalid"
        class="inline-flex items-center gap-2 px-6 py-3 bg-fiori-primary text-fiori-onPrimary text-sm font-medium rounded-md hover:bg-fiori-primaryHover transition-colors disabled:opacity-50">
        <lucide-icon name="search" class="w-4 h-4"></lucide-icon>
        Buscar
      </button>
    </div>
  </div>

</div>
